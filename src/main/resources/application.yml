spring:
  application:
    name: trade-store
  threads:
    virtual:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tradestore}
    username: ${DB_USERNAME:tradestore}
    password: ${DB_PASSWORD:tradestore}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/tradestore}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: trade-store
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.tradestore.domain.TradeRequest
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.tradestore.domain
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    listener:
      concurrency: 3
  mvc:
    problemdetails:
      enabled: true

tradestore:
  zone: ${TRADESTORE_ZONE:UTC}
  topics:
    inbound: trades.inbound
    rejected: trades.rejected
    dead-letter: trades.inbound.dlt
    partitions: 3
  expiry:
    cron: ${TRADESTORE_EXPIRY_CRON:0 0 0 * * *}
    run-on-startup: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
