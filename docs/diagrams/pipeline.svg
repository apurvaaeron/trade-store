<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1502px;height:525px;background:#FFFFFF;" width="1502px" height="525px" viewBox="0 0 1502 525" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="556.312" y="35.421" fill="#000" font-size="22" textLength="387.417" font-weight="700" font-family="Verdana">CI/CD pipeline (GitHub Actions)</text></g><!--entity trigger--><g class="entity" data-qualified-name="trigger" id="ent0001" data-source-line="5"><rect x="12" y="283.109" width="85.714" height="36.297" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="22" y="306.104" fill="#000" font-size="14" textLength="65.714" font-family="Verdana">PR / push</text></g><!--entity build--><g class="entity" data-qualified-name="build" id="ent0002" data-source-line="6"><rect x="194.5" y="58.609" width="364.524" height="85.188" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="204.5" y="81.604" fill="#000" font-size="14" textLength="97.754" font-family="Verdana">build-and-test</text><text x="204.5" y="97.901" fill="#000" font-size="14" textLength="310.023" font-family="Verdana">unit (JUnit 5) -> integration (Testcontainers)</text><text x="204.5" y="114.198" fill="#000" font-size="14" textLength="327.995" font-family="Verdana">-> acceptance (Cucumber) -> JaCoCo >= 85%</text><text x="204.5" y="130.495" fill="#000" font-size="14" textLength="344.524" font-family="Verdana">-> SonarCloud quality gate (with SONAR_TOKEN)</text></g><!--entity pit--><g class="entity" data-qualified-name="pit" id="ent0003" data-source-line="7"><rect x="315.5" y="178.609" width="122.628" height="52.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="325.5" y="201.604" fill="#000" font-size="14" textLength="102.628" font-family="Verdana">mutation-tests</text><text x="325.5" y="217.901" fill="#000" font-size="14" textLength="84.602" font-family="Verdana">PIT >= 70%</text></g><!--entity scan--><g class="entity" data-qualified-name="scan" id="ent0004" data-source-line="8"><rect x="158" y="266.609" width="438.175" height="68.891" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="168" y="289.604" fill="#000" font-size="14" textLength="152.899" font-family="Verdana">oss-vulnerability-scan</text><text x="168" y="305.901" fill="#000" font-size="14" textLength="418.175" font-family="Verdana">Trivy JAR scan (HIGH/CRITICAL = fail, SARIF to Security tab)</text><text x="168" y="322.198" fill="#000" font-size="14" textLength="393.784" font-family="Verdana">OWASP Dependency-Check (optional, CVSS >= 9 = fail)</text></g><!--entity depreview--><g class="entity" data-qualified-name="depreview" id="ent0005" data-source-line="9"><rect x="261" y="370.609" width="232.167" height="52.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="271" y="393.604" fill="#000" font-size="14" textLength="178.726" font-family="Verdana">dependency-review (PRs)</text><text x="271" y="409.901" fill="#000" font-size="14" textLength="212.167" font-family="Verdana">new HIGH/CRITICAL CVE = fail</text></g><!--entity codeql--><g class="entity" data-qualified-name="codeql" id="ent0006" data-source-line="10"><rect x="264" y="458.609" width="226.035" height="52.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="274" y="481.604" fill="#000" font-size="14" textLength="146.836" font-family="Verdana">CodeQL (codeql.yml)</text><text x="274" y="497.901" fill="#000" font-size="14" textLength="206.035" font-family="Verdana">Java SAST, security-extended</text></g><!--entity image--><g class="entity" data-qualified-name="image" id="ent0007" data-source-line="11"><rect x="656" y="178.609" width="516.624" height="52.594" fill="#FFF" style